services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/libswap
      JWT_SECRET: ${JWT_SECRET:?Run npm run docker:setup and use --env-file .env.docker}
      JWT_EXPIRES_IN: 1d
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run npm run docker:setup}
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mongo-data:
